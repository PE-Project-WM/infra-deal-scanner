name: Deep dive on the top-ranked companies

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'top10 = last 3 tagged accounts of the top 10; history = last 3 accounts (tagged and scanned) of every company going forward; universe = add companies under the extra industry codes'
        required: false
        default: 'top10'
      shards:
        description: 'Parallel jobs for history mode (1-20)'
        required: false
        default: '16'
      numbers:
        description: 'History mode only: comma-separated company numbers for a top-up run (blank = every company going forward)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/deep_dive.py'
      - '.github/workflows/deep_dive.yml'

permissions:
  contents: write

jobs:
  deep-dive:
    if: ${{ (inputs.mode || 'top10') == 'top10' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml
      - name: Pull the last 3 accounts for the top 10
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          TOP_N: '10'
        run: |
          mkdir -p data/deep_dive
          set -o pipefail
          python scripts/deep_dive.py 2>&1 | tee data/deep_dive/log.txt
      - name: Save the results back to the repository
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/deep_dive
          git commit -m "Deep dive results $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git pull --rebase
          git push

  plan:
    if: ${{ inputs.mode == 'history' || inputs.mode == 'universe' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        run: |
          N=${{ inputs.shards || '16' }}
          echo "shards=$N" >> $GITHUB_OUTPUT
          echo "list=[$(seq -s, 0 $((N-1)))]" >> $GITHUB_OUTPUT

  history:
    needs: plan
    if: ${{ inputs.mode == 'history' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils
          pip install pandas requests beautifulsoup4 lxml
      - name: Read the last 3 accounts of each company in this shard
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          NUMBERS: ${{ inputs.numbers }}
        run: python scripts/history_fetch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-shard-${{ matrix.shard }}
          path: data/history
          retention-days: 7

  save-history:
    needs: history
    if: ${{ always() && needs.history.result != 'skipped' && inputs.mode == 'history' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: history-shard-*
          path: data/history
          merge-multiple: true
      - name: Combine the shards
        run: |
          python - <<'EOF'
          import glob, os, pandas as pd
          for kind in ('facts', 'filings'):
              parts = [pd.read_csv(p, dtype={'CompanyNumber': str}) for p in sorted(glob.glob(f'data/history/{kind}_*.csv')) if os.path.getsize(p) > 2]
              topup = any('_topup' in p for p in glob.glob(f'data/history/{kind}_*.csv'))
              if topup and os.path.exists(f'data/history/{kind}.csv'):   # a top-up adds to the earlier run instead of replacing it
                  old = pd.read_csv(f'data/history/{kind}.csv', dtype={'CompanyNumber': str})
                  new = pd.concat(parts, ignore_index=True) if parts else old.iloc[0:0]
                  parts = [old[~old['CompanyNumber'].isin(new['CompanyNumber'])], new]
              if parts:
                  pd.concat(parts, ignore_index=True).to_csv(f'data/history/{kind}.csv', index=False)
              for p in glob.glob(f'data/history/{kind}_*.csv'):
                  os.remove(p)
          EOF
      - name: Save the results back to the repository
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/history
          git commit -m "Three-year accounts read $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git pull --rebase -X theirs
          git push

  universe-list:
    needs: plan
    if: ${{ inputs.mode == 'universe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml
      - name: List companies under the extra industry codes
        env:
          STAGE: list
        run: python scripts/universe_extend.py
      - uses: actions/upload-artifact@v4
        with:
          name: universe-list
          path: data/inputs/universe_added.csv
          retention-days: 7

  universe-read:
    needs: [plan, universe-list]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: universe-list
          path: data/inputs
      - name: Read the latest accounts of each company in this shard
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          STAGE: read
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: python scripts/universe_extend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-shard-${{ matrix.shard }}
          path: data/inputs/financials_added_*.csv
          retention-days: 7

  save-universe:
    needs: universe-read
    if: ${{ always() && needs.universe-read.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: universe-*
          path: data/inputs
          merge-multiple: true
      - name: Combine the shards
        run: |
          python - <<'EOF'
          import glob, os, pandas as pd
          parts = [pd.read_csv(p, dtype={'CompanyNumber': str}) for p in sorted(glob.glob('data/inputs/financials_added_*.csv')) if os.path.getsize(p) > 2]
          if parts:
              pd.concat(parts, ignore_index=True).to_csv('data/inputs/financials_added.csv', index=False)
          for p in glob.glob('data/inputs/financials_added_*.csv'):
              os.remove(p)
          EOF
      - name: Save the results back to the repository
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/inputs/universe_added.csv data/inputs/financials_added.csv
          git commit -m "Universe widened to extra industry codes $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git pull --rebase -X theirs
          git push
