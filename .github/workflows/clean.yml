name: 04 Clean and 05 Score

# Runs when the cleaning script, the config or the input data change, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/clean.py'
      - 'scripts/score.py'
      - 'scripts/history.py'
      - 'config/**'
      - 'data/inputs/**'
      - 'data/ocr/ocr_financials.csv'
      - 'scripts/ocr_apply.py'
      - '.github/workflows/clean.yml'

permissions:
  contents: write

# Share a queue with the weekly update so the two never push at the same time
concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install pandas requests beautifulsoup4 lxml
      - name: Run the cleaning step
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        run: |
          set -o pipefail
          python scripts/clean.py 2>&1 | tee data/outputs/clean_log.txt
          python scripts/sectors.py
          python scripts/history_parse.py 2>&1 | tee data/outputs/history_parse_log.txt
          python scripts/history.py 2>&1 | tee data/outputs/history_log.txt
          python scripts/normalise.py 2>&1 | tee data/outputs/normalise_log.txt
          python scripts/score.py 2>&1 | tee data/outputs/score_log.txt
      - name: Save the results back to the repository
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/outputs data/history
          git commit -m "Clean run results $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git pull --rebase -X theirs
          git push
