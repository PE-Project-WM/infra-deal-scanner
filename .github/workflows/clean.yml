name: 04 Clean and 05 Score

# Runs when the cleaning script, the config or the input data change, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/clean.py'
      - 'scripts/score.py'
      - 'config/**'
      - 'data/inputs/**'
      - '.github/workflows/clean.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install pandas requests
      - name: Run the cleaning step
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        run: |
          set -o pipefail
          python scripts/clean.py 2>&1 | tee data/outputs/clean_log.txt
          python scripts/score.py 2>&1 | tee data/outputs/score_log.txt
      - name: Save the results back to the repository
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/outputs
          git commit -m "Clean run results $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git push
